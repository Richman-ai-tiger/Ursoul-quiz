<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#15130f" />
<title>测测你的灵魂对应哪位中国历史人物</title>
<meta name="description" content="40道生活化选择题，测出你灵魂里住着哪位中国历史人物：谋士、帝王、文人、侠客、诗人、将领还是隐士。" />
<style>
:root{
  --ink:#15130f;
  --ink-2:#1e1b15;
  --paper:#f4ede0;
  --paper-2:#efe6d5;
  --paper-3:#e6dbc6;
  --text:#241f19;
  --text-soft:#4d463c;
  --text-mute:#8c8272;
  --gold:#b89355;
  --gold-soft:#cdb083;
  --cinnabar:#a63a2e;
  --cinnabar-soft:#c05a4a;
  --jade:#5d7a68;
  --line:rgba(60,50,36,.16);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(120% 80% at 50% -10%, #26211a 0%, #17140f 45%, #100e0a 100%),
    radial-gradient(60% 40% at 90% 100%, rgba(166,58,46,.10), transparent 70%),
    radial-gradient(50% 40% at 0% 20%, rgba(184,147,85,.08), transparent 70%);
  background-repeat:no-repeat;
  background-size:cover;
  color:var(--text);
  position:relative;
  font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(16px,4vw,40px) clamp(14px,4vw,32px);
  overflow-x:hidden;
}
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 1px, transparent 1px 3px);
  mix-blend-mode:soft-light;opacity:.5;
}
.stage{width:100%;max-width:720px;position:relative;z-index:1}

/* ---------- 通用纸卡 ---------- */
.paper-card{
  position:relative;
  background:
    radial-gradient(120% 90% at 20% 0%, #fbf6ea 0%, var(--paper) 45%, var(--paper-2) 100%);
  border:1px solid rgba(184,147,85,.45);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 30px 60px -30px rgba(0,0,0,.75), 0 2px 12px rgba(0,0,0,.35);
  border-radius:3px;
}
.paper-card::after{
  content:"";position:absolute;inset:7px;pointer-events:none;border:1px solid rgba(184,147,85,.28);border-radius:2px;
}
.paper-texture{
  position:absolute;inset:0;pointer-events:none;opacity:.55;border-radius:inherit;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(150,120,70,.10) 0 1px, transparent 1.5px),
    radial-gradient(circle at 78% 62%, rgba(150,120,70,.08) 0 1px, transparent 1.5px),
    radial-gradient(circle at 42% 88%, rgba(120,95,60,.08) 0 1px, transparent 1.5px),
    radial-gradient(circle at 66% 12%, rgba(120,95,60,.07) 0 1px, transparent 1.5px);
  background-size:120px 120px, 160px 160px, 200px 200px, 90px 90px;
}

/* ---------- 视图切换 ---------- */
.view{display:none}
.view.active{display:block}

/* ---------- 首页 ---------- */
.home{padding:clamp(28px,5vw,44px) clamp(20px,5vw,40px) clamp(24px,4vw,34px);text-align:center;animation:riseIn .7s cubic-bezier(.22,.7,.25,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

.seal-mark{
  width:56px;height:56px;margin:0 auto 18px;border-radius:6px;
  background:linear-gradient(160deg,var(--cinnabar-soft),var(--cinnabar));
  color:#f8efe1;font-family:var(--serif);font-size:26px;line-height:56px;letter-spacing:0;
  box-shadow:0 8px 18px -10px rgba(166,58,46,.9), 0 0 0 1px rgba(255,255,255,.12) inset;
  transform:rotate(-3deg);
  position:relative;
}
.seal-mark::after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.35);border-radius:4px}

.kicker{font-family:var(--serif);font-size:12px;letter-spacing:.42em;color:var(--text-mute);margin:0 0 14px;text-indent:.42em}
.title{
  font-family:var(--serif);font-weight:600;color:var(--text);
  font-size:clamp(20px,6.8vw,40px);line-height:1.38;letter-spacing:.04em;margin:0 0 6px;
}
.title em{font-style:normal;color:var(--cinnabar);position:relative}
.title em::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:6px;background:linear-gradient(90deg,rgba(166,58,46,.28),rgba(166,58,46,.05));z-index:-1}
.subtitle{font-family:var(--serif);color:var(--text-soft);font-size:clamp(14px,3.6vw,16px);line-height:1.9;margin:14px auto 0;max-width:30em;letter-spacing:.02em}

.fates{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 6px}
.fate{
  font-family:var(--serif);font-size:13px;letter-spacing:.12em;color:var(--text-soft);
  padding:7px 13px;border:1px solid rgba(184,147,85,.4);border-radius:999px;
  background:rgba(255,255,255,.35);
}
.fate b{color:var(--cinnabar);font-weight:600;margin-left:2px}

.start-btn{
  margin:30px auto 0;display:block;width:min(300px,80%);
  font-family:var(--serif);font-size:18px;letter-spacing:.32em;text-indent:.32em;
  color:#f7efe0;background:linear-gradient(180deg,#a63a2e,#8d2f24);
  border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:16px 0;cursor:pointer;
  box-shadow:0 14px 28px -16px rgba(166,58,46,.95), 0 1px 0 rgba(255,255,255,.18) inset;
  transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
}
.start-btn:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 18px 34px -18px rgba(166,58,46,1)}
.start-btn:active{transform:translateY(0) scale(.985)}

.meta{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin-top:22px;font-size:12.5px;color:var(--text-mute);letter-spacing:.06em;
}
.meta span{display:inline-flex;align-items:center;gap:6px}
.dot{width:3px;height:3px;border-radius:50%;background:rgba(140,130,114,.5)}
.disclaimer{
  margin:24px auto 0;max-width:34em;font-size:11.5px;line-height:1.8;color:rgba(140,130,114,.9);
  border-top:1px solid var(--line);padding-top:14px;
}

/* ---------- 答题 ---------- */
.quiz{animation:riseIn .5s cubic-bezier(.22,.7,.25,1) both}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
.q-index{font-family:var(--serif);font-size:13px;letter-spacing:.16em;color:rgba(244,237,224,.75)}
.q-index b{color:#f4ede0;font-size:20px;letter-spacing:.06em;font-weight:600}
.q-total{color:rgba(244,237,224,.4);font-size:13px}
.progress-wrap{position:relative;height:4px;border-radius:2px;background:rgba(244,237,224,.13);overflow:hidden}
.progress-bar{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),#d8bd8f);
  box-shadow:0 0 12px rgba(184,147,85,.55);
  transition:width .5s cubic-bezier(.35,.8,.25,1);
}
.progress-glint{position:absolute;top:0;bottom:0;width:32px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  left:-40px;animation:glint 3.2s ease-in-out infinite}
@keyframes glint{0%,70%{left:-40px}100%{left:110%}}

.q-card{
  margin-top:22px;padding:clamp(22px,5vw,34px) clamp(18px,4.4vw,32px) clamp(20px,4vw,28px);
  background:radial-gradient(120% 90% at 20% 0%, #fbf6ea 0%, var(--paper) 45%, var(--paper-2) 100%);
  border:1px solid rgba(184,147,85,.42);border-radius:4px;
  box-shadow:0 24px 50px -28px rgba(0,0,0,.8), 0 2px 10px rgba(0,0,0,.28);
  transition:opacity .26s ease, transform .26s ease;
}
.q-card.out{opacity:0;transform:translateY(-10px) scale(.99)}
.q-card.in{animation:cardIn .42s cubic-bezier(.22,.7,.25,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.988)}to{opacity:1;transform:none}}

.q-label{font-family:var(--serif);font-size:11.5px;letter-spacing:.3em;color:var(--cinnabar);opacity:.8;margin-bottom:12px}
.q-text{font-family:var(--serif);font-size:clamp(19px,4.6vw,24px);line-height:1.6;color:var(--text);margin:0 0 22px;letter-spacing:.02em;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.42);
  border:1px solid rgba(90,75,55,.18);
  border-radius:3px;padding:14px 16px;
  color:var(--text);font-family:var(--sans);font-size:clamp(14.5px,3.9vw,15.5px);line-height:1.62;
  transition:background .22s ease,border-color .22s ease,transform .18s ease,box-shadow .22s ease;
  opacity:0;transform:translateY(8px);
  animation:optIn .42s cubic-bezier(.22,.7,.25,1) forwards;
}
@keyframes optIn{to{opacity:1;transform:none}}
.opt:nth-child(1){animation-delay:.06s}
.opt:nth-child(2){animation-delay:.12s}
.opt:nth-child(3){animation-delay:.18s}
.opt:nth-child(4){animation-delay:.24s}
.opt:hover{background:rgba(255,255,255,.72);border-color:rgba(184,147,85,.55);box-shadow:0 8px 20px -14px rgba(0,0,0,.5)}
.opt:active{transform:scale(.985)}
.opt .key{
  flex:0 0 auto;width:24px;height:24px;border-radius:2px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:13px;color:#8a6a3d;
  background:rgba(184,147,85,.16);border:1px solid rgba(184,147,85,.42);
  transition:background .2s,border-color .2s,color .2s;
}
.opt:hover .key{background:var(--cinnabar);border-color:var(--cinnabar);color:#fbefe2}
.opt .txt{flex:1}
.opt.picked{background:rgba(184,147,85,.22);border-color:var(--gold);animation:none;opacity:1;transform:none}
.opt.picked .key{background:var(--cinnabar);border-color:var(--cinnabar);color:#fbefe2}

.quiz-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:0 4px}
.back-btn{
  background:none;border:none;color:rgba(244,237,224,.55);font-family:var(--serif);
  font-size:13px;letter-spacing:.14em;cursor:pointer;padding:8px 2px;
  transition:color .2s;
}
.back-btn:hover{color:rgba(244,237,224,.9)}
.back-btn:disabled{opacity:.25;cursor:default}
.quiz-tip{font-size:11.5px;color:rgba(244,237,224,.35);letter-spacing:.08em}

/* ---------- 结果 ---------- */
.result{animation:riseIn .6s cubic-bezier(.22,.7,.25,1) both}
.result-head{text-align:center;margin-bottom:18px}
.result-kicker{font-family:var(--serif);font-size:11.5px;letter-spacing:.36em;color:rgba(244,237,224,.55);text-indent:.36em}

.share-card{
  max-width:430px;margin:0 auto;padding:clamp(24px,5.6vw,34px) clamp(20px,5vw,30px) clamp(22px,5vw,30px);
  background:
    radial-gradient(130% 90% at 18% -5%, #fffbf1 0%, var(--paper) 42%, #ece1cd 100%);
  border:1px solid rgba(184,147,85,.55);
  border-radius:3px;
  box-shadow:0 40px 80px -40px rgba(0,0,0,.9), 0 3px 14px rgba(0,0,0,.35);
  position:relative;overflow:hidden;
}
.share-card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,var(--cinnabar),#c96a52 35%,var(--gold) 70%,#8f7340);
  opacity:.85;
}
.share-card::after{content:"";position:absolute;inset:8px;border:1px solid rgba(184,147,85,.26);pointer-events:none}
.share-card .corner{position:absolute;width:16px;height:16px;border:2px solid rgba(184,147,85,.45);pointer-events:none}
.corner.tl{left:14px;top:14px;border-right:0;border-bottom:0}
.corner.tr{right:14px;top:14px;border-left:0;border-bottom:0}
.corner.bl{left:14px;bottom:14px;border-right:0;border-top:0}
.corner.br{right:14px;bottom:14px;border-left:0;border-top:0}

.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.card-tag{font-family:var(--serif);font-size:11px;letter-spacing:.26em;color:var(--text-mute)}
.card-no{font-family:var(--serif);font-size:11px;letter-spacing:.14em;color:var(--text-mute)}

.role-line{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.role-badge{
  font-family:var(--serif);font-size:12.5px;letter-spacing:.22em;text-indent:.22em;
  color:#fbf4e7;background:linear-gradient(180deg,#a63a2e,#8e2f25);
  padding:4px 10px;border-radius:2px;
}
.role-badge-wrap{transform:rotate(-1.4deg)}

.name-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 0}
.name{
  font-family:var(--serif);font-size:clamp(38px,11vw,56px);line-height:1.08;letter-spacing:.06em;
  color:var(--text);font-weight:600;margin:0;
}
.name small{display:block;font-size:13px;letter-spacing:.2em;color:var(--text-mute);font-weight:400;margin-top:10px;font-family:var(--serif)}
.stamp{
  flex:0 0 auto;width:64px;height:64px;border-radius:4px;
  background:linear-gradient(160deg,#b84435,#96311f);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:30px;color:#fbeee2;
  transform:rotate(4deg);
  box-shadow:0 10px 20px -14px rgba(150,49,31,.9), 0 0 0 1px rgba(255,255,255,.14) inset;
  position:relative;opacity:.94;
}
.stamp::after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.32);border-radius:3px}

.match-row{display:flex;align-items:center;gap:10px;margin-top:18px}
.match-label{font-family:var(--serif);font-size:11px;letter-spacing:.2em;color:var(--text-mute);white-space:nowrap}
.match-track{flex:1;height:5px;border-radius:3px;background:rgba(90,75,55,.14);overflow:hidden}
.match-fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#a63a2e,#c19a5c);transition:width 1.1s cubic-bezier(.2,.8,.2,1) .15s}
.match-val{font-family:var(--serif);font-size:16px;color:var(--cinnabar);font-weight:600;min-width:48px;text-align:right}

.quote{
  margin:20px 0 0;padding:16px 0 16px 16px;border-left:2px solid rgba(166,58,46,.45);
  font-family:var(--serif);font-size:clamp(15px,4vw,17px);line-height:1.9;color:var(--text-soft);letter-spacing:.05em;
}
.quote cite{display:block;font-style:normal;font-size:11.5px;letter-spacing:.18em;color:var(--text-mute);margin-top:8px}

.divider{display:flex;align-items:center;gap:10px;margin:24px 0 18px}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(120,100,70,.32),transparent)}
.divider span{font-family:var(--serif);font-size:11px;letter-spacing:.26em;color:var(--text-mute);white-space:nowrap}

.sec{margin-bottom:20px}
.sec-title{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sec-seal{
  width:20px;height:20px;border-radius:2px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:11px;color:#fbf3e6;background:var(--cinnabar);opacity:.9;flex:0 0 auto;
}
.sec-title h3{font-family:var(--serif);font-size:14.5px;letter-spacing:.16em;color:var(--text);margin:0;font-weight:600}
.sec-body{font-size:13.6px;line-height:1.88;color:var(--text-soft);letter-spacing:.01em;margin:0}
.traits{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.trait{
  font-family:var(--serif);font-size:12.5px;letter-spacing:.1em;color:#6d5734;
  padding:4px 9px;border:1px solid rgba(184,147,85,.45);border-radius:2px;
  background:rgba(184,147,85,.1);
}

.bars{margin:2px 0 0}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.bar-name{font-family:var(--serif);font-size:11.5px;color:var(--text-soft);flex:0 0 58px;width:58px;white-space:nowrap;letter-spacing:.04em}
.bar-track{flex:1;height:6px;background:rgba(90,75,55,.12);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar-val{font-size:11px;color:var(--text-mute);width:34px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}

.egg{
  margin-top:4px;padding:14px 15px;border:1px dashed rgba(166,58,46,.38);border-radius:3px;
  background:rgba(166,58,46,.05);
}
.egg .sec-body{font-size:13px;color:#5c4a3c}

.sig{
  margin-top:26px;text-align:center;font-family:var(--serif);
  font-size:clamp(17px,4.4vw,20px);letter-spacing:.14em;color:var(--text);line-height:1.8;
}
.sig::before{content:"「";color:var(--cinnabar);opacity:.6;margin-right:2px}
.sig::after{content:"」";color:var(--cinnabar);opacity:.6;margin-left:2px}

.card-foot{
  margin-top:24px;padding-top:14px;border-top:1px solid rgba(90,75,55,.18);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.card-foot .l{font-family:var(--serif);font-size:11.5px;letter-spacing:.16em;color:var(--text-mute)}
.card-foot .r{font-size:11px;color:rgba(140,130,114,.85);letter-spacing:.06em}

.other{
  max-width:430px;margin:14px auto 0;text-align:center;
  font-family:var(--serif);font-size:12.5px;letter-spacing:.1em;color:rgba(244,237,224,.6);
}
.other b{color:var(--gold-soft);font-weight:600}

.actions{max-width:430px;margin:22px auto 0;display:flex;flex-direction:column;gap:10px}
.btn-row{display:flex;gap:10px}
.btn{
  flex:1;padding:14px 10px;border-radius:4px;cursor:pointer;font-family:var(--serif);
  font-size:14.5px;letter-spacing:.2em;text-indent:.2em;transition:transform .2s,filter .2s,background .2s,color .2s;
  border:1px solid rgba(184,147,85,.62);background:rgba(244,237,224,.10);color:#f6efe2;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(180deg,#a63a2e,#8d2f24);border-color:rgba(255,255,255,.12);color:#fbf3e6;box-shadow:0 14px 28px -18px rgba(166,58,46,.9)}
.snap-tip{text-align:center;font-size:11.5px;color:rgba(244,237,224,.4);margin-top:6px;letter-spacing:.08em}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);
  background:rgba(20,17,12,.92);color:#f4ede0;border:1px solid rgba(184,147,85,.45);
  padding:10px 18px;border-radius:3px;font-size:13px;letter-spacing:.1em;
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;z-index:50;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 小屏优化 */
@media (max-width:420px){
  body{padding:18px 14px 26px;align-items:flex-start}
  .share-card{padding:26px 20px 22px}
  .stamp{width:56px;height:56px;font-size:26px}
  .opts{gap:9px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  body{background:#fff;padding:0}
  .actions,.other,.result-head{display:none}
  .share-card{box-shadow:none;max-width:100%}
}
</style>
</head>
<body>
<div class="stage">

  <!-- ========== 首页 ========== -->
  <section class="view active" id="view-home">
    <div class="paper-card home">
      <div class="paper-texture"></div>
      <div class="seal-mark">魂</div>
      <p class="kicker">灵 魂 图 谱</p>
      <h1 class="title">测测你的灵魂<br />对应哪位<em>中国历史人物</em></h1>
      <p class="subtitle">40 道生活化的小选择题，不考历史。<br />只问习惯、处事、社交与情绪里的你。<br />从这些褶皱里，认出你灵魂的形状。</p>

      <div class="fates" aria-hidden="true">
        <span class="fate">谋士<b>·</b>算</span>
        <span class="fate">帝王<b>·</b>势</span>
        <span class="fate">文人<b>·</b>情</span>

/* 自动统计：每题选项必须 4 个且向量为 5 维 */
function validateData(){
  var errs = [];
  if (ARCHETYPES.length !== 7) errs.push('人物数量应为 7，实际 ' + ARCHETYPES.length);
  if (QUESTIONS.length !== 40) errs.push('题目数量应为 40，实际 ' + QUESTIONS.length);
  QUESTIONS.forEach(function(item, i){
    if (item.o.length !== 4) errs.push('第 ' + (i+1) + ' 题选项数不为 4');
    item.o.forEach(function(opt, j){
      if (!opt[0] || !Array.isArray(opt[1]) || opt[1].length !== 5) errs.push('第 ' + (i+1) + ' 题第 ' + (j+1) + ' 个选项向量异常');
    });
  });
  ARCHETYPES.forEach(function(a){
    if (!Array.isArray(a.w) || a.w.length !== 5) errs.push(a.name + ' 权重异常');
    var sum = a.w.reduce(function(x,y){return x+y;},0);
    if (Math.abs(sum - 1) > 0.0001) errs.push(a.name + ' 权重和不为 1（' + sum + '）');
  });
  return errs;
}

/* ---- 基准线：由题库蒙特卡洛统计得出（各维度在随机作答下的均值与标准差）---- */
var BASELINE_MEAN = [0.21365, 0.17418, 0.24899, 0.16604, 0.19714];
var BASELINE_SD   = [0.04227, 0.03831, 0.04200, 0.03387, 0.04189];

/* 去中心化权重：把「人人都会得的平均分」扣掉，只比人格的偏差方向 */
function centeredWeights(a){
  var raw = a.w.map(function(x){ return x - 0.2; });
  var norm = Math.sqrt(raw.reduce(function(s,v){ return s + v*v; }, 0)) || 1;
  return raw.map(function(v){ return v / norm; });
}

var __vecs = null, __caps = null;
function vectors(){
  if (!__vecs){
    __vecs = ARCHETYPES.map(function(a){ return { a:a, w:centeredWeights(a) }; });
  }
  return __vecs;
}

function tally(answers){
  var totals = [0,0,0,0,0];
  answers.forEach(function(optIdx, i){
    var v = QUESTIONS[i].o[optIdx][1];
    for (var k = 0; k < 5; k++) totals[k] += v[k];
  });
  var sum = totals.reduce(function(a,b){ return a+b; }, 0) || 1;
  return totals.map(function(t){ return t / sum; });
}

function rankFromPct(pct){
  var z = pct.map(function(p,k){ return (p - BASELINE_MEAN[k]) / BASELINE_SD[k]; });
  return vectors().map(function(item){
    var sc = 0;
    for (var k = 0; k < 5; k++) sc += item.w[k] * z[k];
    return { a:item.a, s:sc };
  }).sort(function(x,y){ return (y.s - x.s) || (x.a.id - y.a.id); });
}

/* 每个人格在理想作答下的满分，用来把契合度换算成百分比 */
function idealAnswers(a){
  return QUESTIONS.map(function(q){
    var best = -1e9, bi = 0;
    q.o.forEach(function(opt, i){
      var sc = 0;
      for (var k = 0; k < 5; k++) sc += opt[1][k] * (a.w[k] - 0.2);
      if (sc > best){ best = sc; bi = i; }
    });
    return bi;
  });
}

function caps(){
  if (!__caps){
    __caps = ARCHETYPES.map(function(a){
      var ranked = rankFromPct(tally(idealAnswers(a)));
      var cap = 0;
      for (var i = 0; i < ranked.length; i++) if (ranked[i].a === a) cap = ranked[i].s;
      return Math.max(cap, 1);
    });
  }
  return __caps;
}

/* 核心评分：答案索引数组 -> 结果对象 */
function scoreAnswers(answers){
  var pct = tally(answers);
  var ranked = rankFromPct(pct);
  var best = ranked[0];
  var capList = caps();
  var cap = capList[ARCHETYPES.indexOf(best.a)] || 1;

  var fit = best.s / cap;                       // 相对该人格满分的达成度
  var matchPct = Math.round(84 + 15 * Math.min(1, fit / 0.32));
  matchPct = Math.max(72, Math.min(99, matchPct));

  return {
    primary: best.a,
    secondary: ranked[1].a,
    scores: ranked,
    totals: pct,
    pct: pct,
    matchPct: matchPct
  };
}

/* ---------------- UI ---------------- */
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var answers = [];
  var index = 0;
  var lock = false;
  var current = null;

  var viewHome = $('view-home'), viewQuiz = $('view-quiz'), viewResult = $('view-result');
  var holder = $('qCardHolder');
  var bar = $('bar');
  var qNow = $('qNow');
  var backBtn = $('backBtn');
  var resultHolder = $('resultHolder');

  /* 启动时静默自检，避免带病上线 */
  var errs = validateData();
  if (errs.length) console.warn('[数据自检] ', errs);

  function show(view){
    [viewHome, viewQuiz, viewResult].forEach(function(v){ v.classList.remove('active'); });
    view.classList.add('active');
  }

  function pad(n){ return n < 10 ? '0' + n : String(n); }

  function renderQuestion(animate){
    current = QUESTIONS[index];
    qNow.textContent = pad(index + 1);
    bar.style.width = (index / QUESTIONS.length * 100) + '%';
    var wrap = document.querySelector('.progress-wrap');
    if (wrap) wrap.setAttribute('aria-valuenow', String(index));

    var card = document.createElement('div');
    card.className = 'q-card in';
    card.innerHTML =
      '<div class="q-label">第 ' + pad(index + 1) + ' 题</div>' +
      '<p class="q-text">' + current.q + '</p>' +
      '<div class="opts">' + current.o.map(function(opt, i){
        var keys = ['甲','乙','丙','丁'];
        return '<button class="opt" type="button" data-i="' + i + '">' +
                 '<span class="key">' + keys[i] + '</span>' +
                 '<span class="txt">' + opt[0] + '</span>' +
               '</button>';
      }).join('') + '</div>';

    var old = holder.firstElementChild;
    if (old && animate) { holder.removeChild(old); }
    else if (old) { holder.removeChild(old); }
    holder.appendChild(card);

    if (typeof answers[index] === 'number') {
      var prev = card.querySelector('.opt[data-i="' + answers[index] + '"]');
      if (prev) prev.classList.add('picked');
    }

    card.querySelectorAll('.opt').forEach(function(btn){
      btn.addEventListener('click', function(){ choose(parseInt(btn.dataset.i, 10), btn); });
    });

    backBtn.disabled = index === 0;
  }

  function choose(optIdx, btn){
    if (lock) return;
    lock = true;
    var group = btn.parentNode.querySelectorAll('.opt');
    for (var i = 0; i < group.length; i++) group[i].classList.remove('picked');
    btn.classList.add('picked');
    answers[index] = optIdx;

    var card = btn.closest('.q-card');
    setTimeout(function(){
      card.classList.add('out');
      setTimeout(function(){
        if (index < QUESTIONS.length - 1){
          index++;
          renderQuestion(true);
          lock = false;
        } else {
          finish();
        }
      }, 240);
    }, 190);
  }

  function start(){
    answers = [];
    index = 0;
    lock = false;
    show(viewQuiz);
    window.scrollTo({ top: 0, behavior: 'auto' });
    renderQuestion(false);
  }

  function finish(){
    bar.style.width = '100%';
    var res = scoreAnswers(answers);
    renderResult(res);
    show(viewResult);
    window.scrollTo({ top: 0, behavior: 'auto' });
    lock = false;
  }

  function barsHTML(res){
    var maxPct = Math.max.apply(null, res.pct);
    return DIMS.map(function(d, i){
      var p = Math.round(res.pct[i] * 100);
      var w = maxPct > 0 ? Math.round(res.pct[i] / maxPct * 100) : 0;
      return '<div class="bar-row">' +
               '<div class="bar-name">' + d.name + '·' + d.label + '</div>' +
               '<div class="bar-track"><div class="bar-fill" data-w="' + w + '" style="background:' + d.color + '"></div></div>' +
               '<div class="bar-val">' + p + '%</div>' +
             '</div>';
    }).join('');
  }

    var b = res.secondary;
    var typeNo = pad(a.id);

        '<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>' +
        '<div class="paper-texture"></div>' +
        '<div class="card-top">' +
          '<div class="card-tag">灵 魂 图 谱 · 七 格</div>' +
          '<div class="card-no">NO. ' + typeNo + ' / 07</div>' +
        '</div>' +
        '<div class="role-line"><span class="role-badge-wrap"><span class="role-badge">' + a.role + '</span></span></div>' +
        '<div class="name-row">' +
          '<h2 class="name">' + a.name + '<small>' + a.title + ' · ' + a.era + '</small></h2>' +

        '</div>' +
        '<div class="match-row">' +
          '<div class="match-label">契 合 度</div>' +
          '<div class="match-track"><div class="match-fill" id="matchFill"></div></div>' +
          '<div class="match-val">' + res.matchPct + '%</div>' +
        '</div>' +
        '<blockquote class="quote">' + a.quote + '<cite>' + a.quoteFrom + '</cite></blockquote>' +

          '<p class="sec-body">' + a.summary + '</p>' +
        '</div>' +
        '<div class="sec">' +
          '<div class="sec-title"><span class="sec-seal">合</span><h3>匹配理由</h3></div>' +
          '<p class="sec-body">' + a.reason + '</p>' +
        '</div>' +
        '<div class="sec">' +
          '<div class="sec-title"><span class="sec-seal">藏</span><h3>你的隐藏优势</h3></div>' +
          '<p class="sec-body">' + a.strength + '</p>' +
        '</div>' +

          '<div class="sec-title"><span class="sec-seal">彩</span><h3>趣味彩蛋</h3></div>' +
          '<p class="sec-body">' + a.egg + '</p>' +
        '</div>' +
        '<div class="sig">' + a.sig + '</div>' +
        '<div class="card-foot"><span class="l">测 测 你 的 灵 魂</span><span class="r">' + (a.role === '帝王' ? '势' : a.seal) + ' · 七格其' + '一二三四五六七'[a.id-1] + '</span></div>' +
      '</article>' +
      '<div class="other">灵魂里还住着一位：<b>' + b.role + ' · ' + b.name + '</b><br />（' + b.title + '）</div>';

    // 动画填充
    requestAnimationFrame(function(){
      setTimeout(function(){
        var mf = $('matchFill');
        if (mf) mf.style.width = res.matchPct + '%';
        resultHolder.querySelectorAll('.bar-fill').forEach(function(el){
          el.style.width = el.dataset.w + '%';
        });
      }, 60);
    });
  }

  function copyResult(){
    var res = scoreAnswers(answers);
    var a = res.primary;
    var txt = '我的灵魂是「' + a.name + '」｜' + a.role + ' · ' + a.title + '\n' +
              '契合度 ' + res.matchPct + '%\n' +
              a.sig + '\n' +
              a.quote + ' ' + a.quoteFrom + '\n' +
              '—— 测测你的灵魂对应哪位中国历史人物';
    var done = function(){ toast('已复制，去粘贴吧'); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt, done); });
    } else {
      fallbackCopy(txt, done);
    }
  }

  function fallbackCopy(txt, done){
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); }
    catch(e){ toast('复制失败，可以手动截图分享'); }
    document.body.removeChild(ta);
  }

  var toastTimer = null;
  function toast(msg){
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2000);
  }

  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);
  $('copyBtn').addEventListener('click', copyResult);
  backBtn.addEventListener('click', function(){
    if (lock || index === 0) return;
    index--;
    renderQuestion(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 键盘 1-4
  document.addEventListener('keydown', function(e){
    if (!viewQuiz.classList.contains('active') || lock) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4){
      var btn = holder.querySelector('.opt[data-i="' + (n - 1) + '"]');
      if (btn) choose(n - 1, btn);
    }
  });

  // 首次进入静默校验
  var vErrors = validateData();
  if (vErrors.length) console.error('题库校验失败', vErrors);
})();
